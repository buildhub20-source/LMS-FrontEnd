name: Deploy (production)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or SHA to deploy
        required: true

concurrency:
  group: cd-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Re-verify before release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lms-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lms-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy:
    name: Build image and deploy to production
    needs: verify
    runs-on: ubuntu-latest
    # Requires a reviewer on the `production` environment - keep manual approval on.
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      # Registries reject upper-case names, and github.repository keeps the
      # owner/repo casing (e.g. LMS-FrontEnd), so lower-case it once here.
      - name: Image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lms-frontend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/lms-frontend:latest
            ${{ env.REGISTRY_IMAGE }}/lms-frontend:${{ github.ref_name }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_ENV=production
            VITE_ENABLE_ANALYTICS=true
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_CHAT_SERVICE_URL=${{ vars.VITE_CHAT_SERVICE_URL }}
            VITE_CHAT_WS_URL=${{ vars.VITE_CHAT_WS_URL }}
            VITE_NOTIFICATION_SERVICE_URL=${{ vars.VITE_NOTIFICATION_SERVICE_URL }}
            VITE_NOTIFICATION_WS_URL=${{ vars.VITE_NOTIFICATION_WS_URL }}
            VITE_TENANT_BASE_DOMAIN=${{ vars.VITE_TENANT_BASE_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Replace with your platform's deploy step, then smoke-test /healthz.
      - name: Deploy
        run: echo "Deploying ${{ env.REGISTRY_IMAGE }}/lms-frontend:${{ github.ref_name }}"
