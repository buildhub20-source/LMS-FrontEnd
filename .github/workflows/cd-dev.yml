name: Deploy (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build image and deploy to dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registries reject upper-case names, and github.repository keeps the
      # owner/repo casing (e.g. LMS-FrontEnd), so lower-case it once here.
      - name: Image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lms-frontend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/lms-frontend:dev
            ${{ env.REGISTRY_IMAGE }}/lms-frontend:dev-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_ENV=development
            VITE_ENABLE_ANALYTICS=false
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_CHAT_SERVICE_URL=${{ vars.VITE_CHAT_SERVICE_URL }}
            VITE_CHAT_WS_URL=${{ vars.VITE_CHAT_WS_URL }}
            VITE_NOTIFICATION_SERVICE_URL=${{ vars.VITE_NOTIFICATION_SERVICE_URL }}
            VITE_NOTIFICATION_WS_URL=${{ vars.VITE_NOTIFICATION_WS_URL }}
            VITE_TENANT_BASE_DOMAIN=${{ vars.VITE_TENANT_BASE_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Replace with your platform's deploy step (kubectl / helm / az / aws).
      - name: Deploy
        run: echo "Deploying ${{ env.REGISTRY_IMAGE }}/lms-frontend:dev-${{ github.sha }}"
