name: Deploy (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build image and deploy to dev
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registries reject upper-case names, and github.repository keeps the
      # owner/repo casing (e.g. LMS-FrontEnd), so lower-case it once here.
      - name: Image name
        run: echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lms-frontend
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/lms-frontend:dev
            ${{ env.REGISTRY_IMAGE }}/lms-frontend:dev-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_APP_ENV=development
            VITE_ENABLE_ANALYTICS=false
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_CHAT_SERVICE_URL=${{ vars.VITE_CHAT_SERVICE_URL }}
            VITE_CHAT_WS_URL=${{ vars.VITE_CHAT_WS_URL }}
            VITE_NOTIFICATION_SERVICE_URL=${{ vars.VITE_NOTIFICATION_SERVICE_URL }}
            VITE_NOTIFICATION_WS_URL=${{ vars.VITE_NOTIFICATION_WS_URL }}
            VITE_TENANT_BASE_DOMAIN=${{ vars.VITE_TENANT_BASE_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Testing VM (LMS-BackEnd/deploy/vm). Until the DEPLOY_* secrets exist
      # the image is still published and this step only says so.
      - name: Deploy to the testing VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST is not set: image published, nothing deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd ~/LMS-BackEnd/deploy/vm && ./deploy.sh frontend'
